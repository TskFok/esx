[package]
name = "esx"
version = "1.4.0"
description = "Elasticsearch Dev Tools desktop app built with Tauri"
authors = ["ushopal"]
edition = "2021"

[lib]
name = "esx_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
encoding_rs = "0.8"
keyring = { version = "3.6.3", features = ["apple-native", "windows-native", "sync-secret-service"] }
reqwest = { version = "0.12.24", features = ["blocking", "json", "rustls-tls-manual-roots-no-provider"] }
rustls = { version = "0.23.38", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
ssh2 = "0.9.5"
ring = "0.17.14"
tokio = { version = "1", features = ["macros", "sync", "time", "net"] }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-prevent-default = "4"
tauri-plugin-store = "2"
